<!-- hyperframes-registry-item: factory-pipeline -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f8f9fa;
      }

      /* ── Stage ────────────────────────────────────────────────── */
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #f8f9fa;
        font-family: Inter, system-ui, sans-serif;
        overflow: hidden;
        opacity: 0; /* fades in at t=0 */
      }

      /* ── Pipeline boxes ───────────────────────────────────────── */
      .fp-box {
        position: absolute;
        width: 240px;
        height: 100px;
        top: 490px;
        border-radius: 16px;
        border: 2px solid #d1d5db;
        background: #ffffff;
        opacity: 0; /* GSAP reveals via clip-path */
        will-change: transform, box-shadow;
      }
      .fp-box--accent {
        border: 2.5px solid #f02d5e;
        background: rgba(240, 45, 94, 0.06);
      }

      /* ── Labels (sit above boxes as separate elements) ────────── */
      .fp-label {
        position: absolute;
        width: 240px;
        height: 100px;
        top: 490px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 600;
        color: #111827;
        pointer-events: none;
        opacity: 0;
        z-index: 2;
      }
      .fp-label--accent {
        color: #f02d5e;
      }

      /* ── Arrow SVGs ───────────────────────────────────────────── */
      .fp-arrow {
        position: absolute;
        top: 525px; /* 540 (box center-y) − 15 (half SVG height) */
        opacity: 0;
        overflow: visible;
      }

      /* ── Bottom tagline ───────────────────────────────────────── */
      .fp-tagline {
        position: absolute;
        top: 640px;
        left: 0;
        width: 1920px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #9ca3af;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!--
      HyperFrames composition root
      totalW = 5×240 + 4×120 = 1680  ·  startX = (1920−1680)/2 = 120
      Box left edges: 120 | 480 | 840 | 1200 | 1560
      Arrow left edges (right of prev box): 360 | 720 | 1080 | 1440
    -->
    <div
      id="stage"
      data-composition-id="factory-pipeline"
      data-start="0"
      data-duration="9"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >

      <!-- ── Box 0: Intake ──────────────────────────────────────── -->
      <div class="fp-box" id="fp-box-0" style="left:120px;"></div>
      <div class="fp-label" id="fp-label-0" style="left:120px;">Intake</div>

      <!-- Arrow 0: 360 → 480 -->
      <svg class="fp-arrow" id="fp-arrow-0" style="left:360px;" width="120" height="30"
           viewBox="0 0 120 30" overflow="visible">
        <defs>
          <marker id="fp-ah0" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b7280" />
          </marker>
        </defs>
        <line id="fp-aline0" x1="4" y1="15" x2="116" y2="15"
              stroke="#6b7280" stroke-width="2"
              marker-end="url(#fp-ah0)"
              stroke-dasharray="112" stroke-dashoffset="112" />
      </svg>

      <!-- ── Box 1: Triage ──────────────────────────────────────── -->
      <div class="fp-box" id="fp-box-1" style="left:480px;"></div>
      <div class="fp-label" id="fp-label-1" style="left:480px;">Triage</div>

      <!-- Arrow 1: 720 → 840 -->
      <svg class="fp-arrow" id="fp-arrow-1" style="left:720px;" width="120" height="30"
           viewBox="0 0 120 30" overflow="visible">
        <defs>
          <marker id="fp-ah1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b7280" />
          </marker>
        </defs>
        <line id="fp-aline1" x1="4" y1="15" x2="116" y2="15"
              stroke="#6b7280" stroke-width="2"
              marker-end="url(#fp-ah1)"
              stroke-dasharray="112" stroke-dashoffset="112" />
      </svg>

      <!-- ── Box 2: Build ───────────────────────────────────────── -->
      <div class="fp-box" id="fp-box-2" style="left:840px;"></div>
      <div class="fp-label" id="fp-label-2" style="left:840px;">Build</div>

      <!-- Arrow 2: 1080 → 1200 -->
      <svg class="fp-arrow" id="fp-arrow-2" style="left:1080px;" width="120" height="30"
           viewBox="0 0 120 30" overflow="visible">
        <defs>
          <marker id="fp-ah2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b7280" />
          </marker>
        </defs>
        <line id="fp-aline2" x1="4" y1="15" x2="116" y2="15"
              stroke="#6b7280" stroke-width="2"
              marker-end="url(#fp-ah2)"
              stroke-dasharray="112" stroke-dashoffset="112" />
      </svg>

      <!-- ── Box 3: Verify (ACCENT) ─────────────────────────────── -->
      <div class="fp-box fp-box--accent" id="fp-box-3" style="left:1200px;"></div>
      <div class="fp-label fp-label--accent" id="fp-label-3" style="left:1200px;">Verify</div>

      <!-- Arrow 3: 1440 → 1560 -->
      <svg class="fp-arrow" id="fp-arrow-3" style="left:1440px;" width="120" height="30"
           viewBox="0 0 120 30" overflow="visible">
        <defs>
          <marker id="fp-ah3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b7280" />
          </marker>
        </defs>
        <line id="fp-aline3" x1="4" y1="15" x2="116" y2="15"
              stroke="#6b7280" stroke-width="2"
              marker-end="url(#fp-ah3)"
              stroke-dasharray="112" stroke-dashoffset="112" />
      </svg>

      <!-- ── Box 4: Close loop ──────────────────────────────────── -->
      <div class="fp-box" id="fp-box-4" style="left:1560px;"></div>
      <div class="fp-label" id="fp-label-4" style="left:1560px;">Close loop</div>

      <!-- ── Tagline ───────────────────────────────────────────── -->
      <div class="fp-tagline" id="fp-tagline">EVERY FACTORY ARRIVES HERE</div>

    </div><!-- /#stage -->

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // ── t=0: stage background fades in (0.3 s) ──────────────────
      tl.to("#stage", { opacity: 1, duration: 0.3, ease: "none" }, 0);

      // ── Helper: reveal a box via left→right clip-path wipe ───────
      // Each box starts opacity:0 in CSS; fromTo sets opacity:1 immediately
      // via the "from" object and wipes using clip-path inset.
      function revealBox(id, t) {
        tl.fromTo(
          id,
          { opacity: 1, clipPath: "inset(0 100% 0 0 round 16px)" },
          { clipPath: "inset(0 0% 0 0 round 16px)", duration: 0.5, ease: "power2.out" },
          t
        );
      }

      // ── Helper: fade in a label ──────────────────────────────────
      function revealLabel(id, t) {
        tl.fromTo(
          id,
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          t
        );
      }

      // ── Helper: draw an SVG arrow line via stroke-dashoffset ─────
      function drawArrow(svgId, lineId, t) {
        tl.set(svgId, { opacity: 1 }, t);
        tl.fromTo(
          lineId,
          { strokeDashoffset: 112 },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" },
          t
        );
      }

      // ── BOX/LABEL/ARROW DRAW-ON SEQUENCE ────────────────────────
      //
      // Timing (label starts at 56% through its box's 0.5 s window):
      //   Box 0  t=0.30  Label 0  t=0.58  Arrow 0  t=0.80
      //   Box 1  t=1.20  Label 1  t=1.48  Arrow 1  t=1.70
      //   Box 2  t=2.10  Label 2  t=2.38  Arrow 2  t=2.60
      //   Box 3  t=3.00  Label 3  t=3.28  Arrow 3  t=3.50
      //   Box 4  t=3.90  Label 4  t=4.18
      //   All done ≈ t=4.48, well before the pulse at t=5.5

      revealBox("#fp-box-0", 0.30);
      revealLabel("#fp-label-0", 0.58);
      drawArrow("#fp-arrow-0", "#fp-aline0", 0.80);

      revealBox("#fp-box-1", 1.20);
      revealLabel("#fp-label-1", 1.48);
      drawArrow("#fp-arrow-1", "#fp-aline1", 1.70);

      revealBox("#fp-box-2", 2.10);
      revealLabel("#fp-label-2", 2.38);
      drawArrow("#fp-arrow-2", "#fp-aline2", 2.60);

      revealBox("#fp-box-3", 3.00);
      revealLabel("#fp-label-3", 3.28);
      drawArrow("#fp-arrow-3", "#fp-aline3", 3.50);

      revealBox("#fp-box-4", 3.90);
      revealLabel("#fp-label-4", 4.18);

      // Clear clip-paths once all boxes are fully revealed so GSAP's
      // scale transform on the Verify pulse isn't bounded by inset(0 0%).
      tl.set(
        "#fp-box-0, #fp-box-1, #fp-box-2, #fp-box-3, #fp-box-4",
        { clearProps: "clipPath" },
        4.7
      );

      // ── VERIFY PULSE (t=5.5–6.5): 2 beats ──────────────────────
      // Beat 1 up
      tl.to(
        "#fp-box-3",
        {
          scale: 1.04,
          boxShadow: "0 0 32px 6px rgba(240,45,94,0.35)",
          duration: 0.25,
          ease: "power1.inOut",
        },
        5.5
      );
      // Beat 1 down
      tl.to(
        "#fp-box-3",
        {
          scale: 1,
          boxShadow: "0 0 0px 0px rgba(240,45,94,0)",
          duration: 0.25,
          ease: "power1.inOut",
        },
        5.75
      );
      // Beat 2 up
      tl.to(
        "#fp-box-3",
        {
          scale: 1.04,
          boxShadow: "0 0 32px 6px rgba(240,45,94,0.35)",
          duration: 0.25,
          ease: "power1.inOut",
        },
        6.0
      );
      // Beat 2 down
      tl.to(
        "#fp-box-3",
        {
          scale: 1,
          boxShadow: "0 0 0px 0px rgba(240,45,94,0)",
          duration: 0.25,
          ease: "power1.inOut",
        },
        6.25
      );

      // ── TAGLINE FADE IN (t=6.0) ──────────────────────────────────
      tl.fromTo(
        "#fp-tagline",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        6.0
      );

      // ── HOLD: t=6.5–8.0 (no explicit tweens needed) ─────────────

      // ── FADE OUT: t=8.0–9.0 ─────────────────────────────────────
      tl.to("#stage", { opacity: 0, duration: 1.0, ease: "power1.in" }, 8.0);

      // ── HF contract: register paused, seek to frame 0 ───────────
      tl.seek(0);
      window.__timelines["factory-pipeline"] = tl;
    </script>
  </body>
</html>

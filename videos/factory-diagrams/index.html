<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .label {
        color: #f02d5e;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="factory-diagrams"
      data-start="0"
      data-duration="3"
      data-fps="30"
      data-width="1920"
      data-height="1080"
      style="display: flex; align-items: center; justify-content: center; width: 1920px; height: 1080px; background: #0a0a0f;"
    >
      <div id="label" class="label">Replay QA · Factory Diagrams</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#label", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);
      tl.to("#label", { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.3);
      tl.seek(0);
      window.__timelines["factory-diagrams"] = tl;
    </script>
  </body>
</html>
